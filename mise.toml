[tools]
node = "latest"
gradle = "latest"
java = "21"

[tasks.debug]
description = "Build a standalone Android test APK locally"
run = '''
export NODE_ENV=production
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
./scripts/setup-android-sdk.sh "$ANDROID_HOME"
npm ci --include=dev
npm --workspace apps/mobile exec expo prebuild -- --platform android --clean --no-install
printf 'sdk.dir=%s\n' "$ANDROID_HOME" > apps/mobile/android/local.properties
cd apps/mobile/android
chmod +x ./gradlew
./gradlew :app:assembleRelease --no-daemon
APK="$PWD/app/build/outputs/apk/release/app-release.apk"
test -f "$APK"
unzip -l "$APK" | grep -q 'assets/index.android.bundle'
"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
echo "APK ready: apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
'''

[tasks.build-apk]
description = "Alias for the local standalone Android build"
depends = ["debug"]
