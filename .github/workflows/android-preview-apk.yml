name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-preview-apk.yml"
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: android-preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable APK
        working-directory: apps/mobile/android
        timeout-minutes: 30
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: paraggi-android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test APK launch
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n 1)"
            adb install -r -t "$APK"
            adb logcat -c
            adb shell monkey -p app.paraggi.mobile -c android.intent.category.LAUNCHER 1
            sleep 12
            adb logcat -d > android-launch-logcat.txt
            if ! adb shell pidof app.paraggi.mobile; then
              echo "Paraggi process is not running after launch"
              tail -n 300 android-launch-logcat.txt
              exit 1
            fi
            if grep -E "FATAL EXCEPTION:.*|Process: app\.paraggi\.mobile.*has died" android-launch-logcat.txt; then
              echo "Fatal Android error detected after launch"
              exit 1
            fi

      - name: Upload launch logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paraggi-android-launch-logcat
          path: android-launch-logcat.txt
          if-no-files-found: ignore
