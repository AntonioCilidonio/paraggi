name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-preview-apk.yml"
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paraggi-android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Smoke test APK launch
        continue-on-error: true
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set +e
            APK="$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n 1)"
            adb install -r "$APK"
            INSTALL_STATUS=$?
            adb shell monkey -p app.paraggi.mobile -c android.intent.category.LAUNCHER 1
            LAUNCH_STATUS=$?
            sleep 8
            adb logcat -d > android-launch-logcat.txt
            adb shell pidof app.paraggi.mobile
            PID_STATUS=$?
            if [ "$INSTALL_STATUS" -ne 0 ]; then
              echo "APK install failed"
              exit "$INSTALL_STATUS"
            fi
            if [ "$LAUNCH_STATUS" -ne 0 ]; then
              echo "APK launch command failed"
              exit "$LAUNCH_STATUS"
            fi
            if [ "$PID_STATUS" -ne 0 ]; then
              echo "Paraggi process is not running after launch"
              exit "$PID_STATUS"
            fi

      - name: Upload launch logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paraggi-android-launch-logcat
          path: android-launch-logcat.txt
          if-no-files-found: ignore
